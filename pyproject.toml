[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "medmlx-core"
version = "0.1.2"
description = "Shared MLX runtime for MedMLX model packages"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/MONAI_LICENSE"]
authors = [{ name = "Joseph Sandoval" }, { name = "Alfredo Sandoval Jr." }]
dependencies = [
  "mlx>=0.32.3,<0.33; platform_system == 'Darwin' and platform_machine == 'arm64'",
  "numpy>=2.0,<3",
]

[project.optional-dependencies]
conversion = [
  "torch>=2.6,<3",
]
dev = [
  "pyright[nodejs]==1.1.414",
  "hypothesis>=6.140,<7",
  "monai==1.6.0",
  "numpy>=2.2,<3",
  "pytest>=8.4,<10",
  "ruff>=0.13,<1",
  "torch==2.14.1",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/medmlx_core"]

[tool.hatch.build.targets.wheel.force-include]
"licenses/MONAI_LICENSE" = "medmlx_core/licenses/MONAI_LICENSE"
"THIRD_PARTY_NOTICES.md" = "medmlx_core/THIRD_PARTY_NOTICES.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-select = ["TID251", "ANN401"]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["scripts","src","tests"]
extraPaths = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
enableTypeIgnoreComments = false
reportUnnecessaryTypeIgnoreComment = "error"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Any" = {msg = "Use a precise type and parse untyped values at the boundary."}
"typing_extensions.Any" = {msg = "Use a precise type and parse untyped values at the boundary."}
