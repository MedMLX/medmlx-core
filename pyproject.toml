[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "medmlx-core"
version = "0.1.1"
description = "Shared MLX runtime for MedMLX model packages"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Proprietary" }
authors = [{ name = "Joseph Sandoval" }, { name = "Alfredo Sandoval Jr." }]
dependencies = [
  "mlx>=0.32.2,<0.33; platform_system == 'Darwin' and platform_machine == 'arm64'",
  "mlx>=0.32.2,<0.33; platform_system == 'Linux' and platform_machine == 'x86_64'",
  "numpy>=2.0,<3",
]

[project.optional-dependencies]
cpu = [
  "mlx[cpu]>=0.32.2,<0.33; platform_system == 'Linux' and platform_machine == 'x86_64'",
]
cuda12 = [
  "mlx[cuda12]>=0.32.2,<0.33; platform_system == 'Linux' and platform_machine == 'x86_64'",
]
cuda13 = [
  "mlx[cuda13]>=0.32.2,<0.33; platform_system == 'Linux' and platform_machine == 'x86_64'",
]
conversion = [
  "torch>=2.6,<3",
]
dev = [
  "monai==1.6.0",
  "pytest>=8.4,<10",
  "ruff>=0.13,<1",
  "torch>=2.6,<3",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/medmlx_core"]

[tool.hatch.build.targets.wheel.force-include]
"licenses/MONAI_LICENSE" = "medmlx_core/licenses/MONAI_LICENSE"
"THIRD_PARTY_NOTICES.md" = "medmlx_core/THIRD_PARTY_NOTICES.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
